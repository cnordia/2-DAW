{% extends 'app/base.html' %}

{% block content %}
    <h2>Gestión de Productos</h2>
    <a href="{% url 'nuevo_producto' %}" class="btn btn-success mb-3">Nuevo Producto</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Marca</th>
                <th>Stock</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for prod in productos %}
            <tr>
                <td>{{ prod.nombre }}</td>
                <td>{{ prod.marca }}</td>
                <td>{{ prod.unidades }}</td>
                <td>{{ prod.precio }} €</td>
                <td>
                    <a href="{% url 'editar_producto' prod.pk %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'eliminar_producto' prod.pk %}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
