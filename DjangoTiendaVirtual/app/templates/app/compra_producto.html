{% extends 'app/base.html' %}

{% block content %}
    <h2>Comprar {{producto}}</h2>
    <h4>Detalles</h4>
    <p>{{producto.precio}} $ + IVA</p>
    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-danger">Comprar</button>
        <a href="{% url 'productos' %}" class="btn btn-secondary">Volver</a>
    </form>
{% endblock %}
