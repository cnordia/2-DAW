{% extends 'app/base.html' %}

{% block content %}
    <h2>{% if object %}Editar{% else %}Nuevo{% endif %} Producto</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'productos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
